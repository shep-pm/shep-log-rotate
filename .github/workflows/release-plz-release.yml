name: Release
# Tags the commit, creates the GitHub release, and uploads to crates.io.
#
# Runs on every push to main and does nothing unless Cargo.toml names a
# version that is not on crates.io. That is what makes merging the release
# pull request the act that publishes: the merge is the only thing that moves
# the version.
#
# There is no test gate here, and that is deliberate rather than an omission.
# Until 2026-08-27 this job waited on a `workflow_run` for test.yml's run on the same commit, because nothing else stopped an untested commit reaching main.
# main now has a ruleset requiring lint, docs, msrv, integration and the test
# matrix, so an untested commit cannot reach main in the first place. Removing
# that ruleset without restoring a gate would leave this publishing whatever
# lands on main.

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run-tag:
        description: >-
          An existing tag of this crate, e.g. v0.2.4. When set, also runs shep's
          dog release workflow as a dry run against it: it builds every target
          and prints the hashes, and uploads and opens nothing.
        type: string
        default: ""

concurrency:
  group: release-plz-release
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # An environment, so a required reviewer can be added here if this ever
    # wants a human gate between merging and spending a version number.
    # Inert until one is configured.
    environment: crates-io
    outputs:
      # release-plz reports what it released. `releases_created` is the string
      # `true` only when it tagged something, and `releases` is a JSON array of
      # `{package_name, tag, version, ...}`, one entry per released package.
      releases_created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ steps.release.outputs.releases }}
    steps:
      # Every action in these two files is pinned by commit, unlike test.yml's,
      # which use moving tags. These jobs hold RELEASE_PLZ_TOKEN and
      # CARGO_REGISTRY_TOKEN; test.yml's hold neither. A mutable tag in a job
      # with an upload token is a different risk from one in a job that only
      # runs tests.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # release-plz needs the history to know what is already released.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # That token is write-capable, and without this the checkout writes
          # it into .git/config, where every later step in the job can read it.
          # release-plz pushes its branch, its commits and its tags over the
          # GitHub API rather than the git CLI, so nothing here needs it
          # persisted. The old release-plz.yml set this and said so; it was
          # lost moving to zendriver-rs's shape, which does not set it.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # This action normally reads its toolchain from its own git ref, and
          # pinning by SHA replaces that ref with a hash it cannot parse. It
          # fails with "'toolchain' is a required input" rather than defaulting,
          # so the pin and this line go together.
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Same commit pin as release-plz-pr.yml, for the same reason.
      - id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Builds the bare binaries `shep install` downloads, attaches them to the
  # release release-plz just created, and opens the pull request on shep-pm/shep
  # that approves this version and their hashes in the dog index. A person
  # merging that pull request is the review; nothing here approves a version.
  #
  # Called from here rather than from a `release: published` trigger like
  # docs-dispatch.yml, so it does not depend on which token created the
  # release: a release made with GITHUB_TOKEN fires no such event. It runs only
  # when release-plz released something, read from its outputs, because this
  # workflow runs on every push to main and almost all of them release nothing.
  #
  # The release exists by the time this runs, which the reusable workflow
  # checks before it builds, and the tag is `v<version>`, which `shep install`
  # builds its download URL from.
  #
  # Pinned by commit, like every action here, and for the reason shep's docs
  # give: the workflow runs with this job's `contents: write` and the index
  # token, so a ref that can move lets a later change to it run with both. Move
  # the sha when you choose to. This one is the merge of shep-pm/shep#1463.
  #
  # SHEP_INDEX_TOKEN is a PAT or GitHub App token that can push a branch and
  # open a pull request on shep-pm/shep. It has to be a secret of this
  # repository. GITHUB_TOKEN cannot write to another repository.
  dog-release:
    name: Build and index the binaries
    needs: release-plz-release
    if: needs.release-plz-release.outputs.releases_created == 'true'
    permissions:
      contents: write
      actions: read
    uses: shep-pm/shep/.github/workflows/dog-release.yml@1b249795a392c8bc4ab361f1cf33731fc079da8e
    with:
      package: shep-log-rotate
      # One crate, so one entry.
      tag: ${{ fromJSON(needs.release-plz-release.outputs.releases)[0].tag }}
    secrets:
      index-token: ${{ secrets.SHEP_INDEX_TOKEN }}

  # The dry run for the job above: by hand with a tag, it builds an existing
  # release's binaries for every target and prints the hashes, so the path can
  # be checked without spending a version number or opening a pull request on
  # shep-pm/shep. `dog-release` cannot serve for this, since it runs only when
  # release-plz released something and a dispatch on a released tag releases
  # nothing. No `needs`: the dry run has no use for the release job's outcome.
  # No secret, since a dry run opens no pull request. The permissions match the
  # job above because a caller has to grant what the reusable workflow's
  # `upload` job asks for, even when a dry run skips that job.
  dog-release-dry-run:
    name: Dry-run the binaries
    if: github.event_name == 'workflow_dispatch' && inputs.dry-run-tag != ''
    permissions:
      contents: write
      actions: read
    uses: shep-pm/shep/.github/workflows/dog-release.yml@1b249795a392c8bc4ab361f1cf33731fc079da8e
    with:
      package: shep-log-rotate
      tag: ${{ inputs.dry-run-tag }}
      dry-run: true
