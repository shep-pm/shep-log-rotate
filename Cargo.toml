[package]
name = "shep-log-rotate"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
description = "A log-rotation dog for shep: renames grown logs, asks the shepherd to reopen, then compresses and prunes"
repository = "https://github.com/shep-pm/shep-log-rotate"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["shep", "process-manager", "logrotate", "logging"]
categories = ["command-line-utilities"]
# `docs/` is this project's own planning and design notes, written by the
# skills that produced the code. They are worth keeping in the repository
# and are not worth shipping: a published .crate is permanent, so every
# draft in there would outlive the decisions it argues about, and docs.rs
# would carry them beside the API. The repository is where to read them.
exclude = ["/docs/"]

[features]
# The tier that drives a REAL shepherd. Off by default because it needs a
# `shep` binary, which a fresh clone does not have. See tests/integration.rs.
integration = []

[dependencies]
# Version AND git, deliberately, until shep is on crates.io.
#
# Cargo uses the git source to build, so this tracks shep's main the way it
# has all along. But `cargo package` refuses a dependency with no version
# requirement, so without the version this crate cannot be published at all,
# and finding that out on publish day is the wrong time.
#
# Published 2026-08-26, so the git and branch keys are gone and this resolves
# from the registry. The lockfile is what proves which source was used.
#
# The floor is 0.16.1, the shep this dog is built and tested against. It is
# a raised floor rather than the oldest version that still compiles, and that
# is a change in what a floor here is for.
#
# While this dog hand-rolled its startup, the honest floor was the oldest
# shep-client carrying each call it made, listed below. `DogRuntime` took the
# hand-rolled part away: one call connects as the dog's identity and reads
# its section, which is the startup every other dog has, and `Client::dog_config`
# took the request away. What a dog now depends on is shep's own shape for a
# dog, and that shape moves with shep. Keeping a floor three majors back
# would advertise a build nobody has run since.
#
# Protocol is still what a version skew breaks first, and it is not what
# binds here. A dog announces the `PROTOCOL_VERSION` of the shep-core it was
# compiled against, and the shepherd refuses a handshake below its own
# `MIN_SUPPORTED`. 0.16.1 announces 11 and accepts 8, so this dog is still
# heard by a much older shepherd; what it asks for is not. Its section now
# goes through `Request::DogConfigResolved`, and a shepherd too old to know
# that request is answered by the client's own fallback to the plain one, so
# an old daemon still serves this dog, just without resolving a secret
# reference in its section.
#
# The older floors, kept because each is still load-bearing and none is
# visible in a version number:
#
# - 0.13.0 first had `Client::dog_config` ask `Request::DogConfigResolved`,
#   which is what lets a `[<name>]` section hold a `{{secret:...}}` reference
#   and reach this dog expanded. Below it the same call asks the plain
#   request, and a section naming a reference arrives as the reference.
# - 0.11.0 first carried `dogs::DogRuntime` and `dogs::DogIdentity`, the
#   connection-plus-section startup and the two-name identity this crate used
#   to spell by hand.
# - 0.10.0 is where a config field says it holds a credential. Until then
#   that was a `DogConfig` derive, and a derive can only add items beside the
#   type, never rewrite the one it sits on, so it emitted a flat list of Rust
#   field names and `config_schema` walked the finished schema marking
#   top-level properties that matched. Anything nested was never reached, and
#   a name the walk could not find at all came back as an error. 0.10.0
#   replaced it with a `dog_config` attribute that puts the mark on the field
#   itself, where `schemars` carries it to whatever depth the property ends up
#   at, and `config_schema` stopped returning a `Result` in the same breath
#   because there is no longer a name it can fail to find. Both halves are
#   compile-time here: below 0.10.0 `src/config.rs` names an attribute that
#   does not exist yet, and at 0.10.0 and above the derive it used to name is
#   gone.
# - 0.1.23 first carried `ReconnectingClient::connect_as_dog`. shep records a
#   handshake only for a connection that names a dog, so without it this
#   binary serves every request correctly and is still rendered `silent`,
#   restarted once, and then declared stale. `DogRuntime::start` is the
#   caller now, and it reaches the same call. See the module docs in
#   src/main.rs.
# - 0.2.2 first carried `dogs::probe`, which answers the `--version` and
#   `--schema` questions shep asks a candidate binary during `shep adopt`.
# - 0.7.3 first forwarded shep-client's `schema` feature down to shep-core's
#   own, which is what puts the `JsonSchema` impls on `MemSize` and
#   `UpDuration`. Before it, a dog borrowing shep's grammars for its config
#   type needed a second, direct shep-core dependency to turn that feature
#   on. After it, `shep_client::shep_core` is the only path to these types.
shep-client = "0.16.1"
# `#[derive(JsonSchema)]` expands to absolute `schemars::` paths, so the
# crate has to be nameable here even though shep-client already carries it.
# Same version floor shep itself pins, so this adds an edge and not a crate.
schemars = { version = "1.2.2", default-features = false, features = ["derive", "std"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "signal", "sync"] }
toml = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# `test-support` only, and only so `Live` is tested over a real socket rather
# than asserted in a comment: its redacted `Debug`, the request it puts on the
# wire for its own section, and a tick that survives its shepherd being
# replaced. The feature gates shep-client's own `testing` module, which binds a
# fake shepherd this crate can connect to. Nothing in the shipped binary sees
# it.
shep-client = { version = "0.16.1", features = ["test-support"] }
# The schema tests read the JSON `config_schema` builds, so they need the
# type it is made of. Nothing in the shipped binary names serde_json.
serde_json = "1"

[[test]]
name = "integration"
required-features = ["integration"]

# The same profile settings shep itself carries, for the same reasons.
#
# Debug info dominates a debug build, and a dependency's is never what is
# being debugged. Measured 2026-09-03, clean `cargo test --no-run`:
#
#   target/debug   562 MiB   before
#   target/debug   348 MiB   after
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size, not speed. shep measured thin LTO with one codegen unit at a quarter
# off its binary and nothing measurable off its runtime, and this crate's
# only hot loop is flate2's, which a 64 MiB gzip run timed the same either
# way on 2026-09-03: 190 to 255 MiB/s in both builds, the spread all noise.
# Fat LTO buys another megabyte for another half minute of build, which
# `cargo install` pays on every upgrade. Measured the same day, clean
# `cargo build --release`:
#
#   shep-log-rotate   2,515,168 bytes   before
#   shep-log-rotate   2,012,672 bytes   after
#
# Not `strip`, and not `panic = "abort"`, for shep's reasons: symbols are
# what a profiler names frames with, and `shep-client` re-raises a panicked
# task with `resume_unwind`, which needs a runtime that unwinds.
[profile.release]
lto = "thin"
codegen-units = 1
